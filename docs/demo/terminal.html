<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal</title>
<!-- Replays JobRadar sessions for the README GIFs (docs/demo/scene_*.py). Command output is the
     text the CLI and the plugin print; figures come from the synthetic demo home (seed.py).
     ?mode=claude shows a Claude Code transcript instead of a shell. -->
<style>
  :root { --bg: #1f2023; --fg: #e8e3d8; --dim: #8e9099; --ok: #9cc28a; --warn: #d9b26a;
          --bad: #d98a7a; --score: #e2a663; --path: #8fb3d9; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { font: 18px/1.5 Consolas, "Cascadia Mono", monospace; color: var(--fg);
         padding: 22px 26px; box-sizing: border-box; overflow: hidden; }
  .line { white-space: pre-wrap; min-height: 1.5em; }
  .dim { color: var(--dim); } .ok { color: var(--ok); } .warn { color: var(--warn); }
  .bad { color: var(--bad); } .score { color: var(--score); font-weight: bold; }
  .path { color: var(--path); } .b { font-weight: bold; color: #fff; }
  .prompt .who { color: var(--ok); } .prompt .cwd { color: var(--path); }
  .cc { color: #fff; }
  input { all: unset; color: var(--fg); caret-color: var(--fg); width: 62%; }
  body.claude input { width: 96%; }
  #hd { position: absolute; top: 0; left: 0; right: 0; padding: 12px 26px; color: var(--dim);
        border-bottom: 1px solid #34363b; font-weight: bold; display: none; }
  body.claude #hd { display: block; }
  #screen { position: absolute; left: 26px; right: 26px; bottom: 22px; }
</style>
</head>
<body>
<div id="hd">Claude Code  ·  ~/jobradar</div>
<div id="screen"></div>
<script>
const CLAUDE = new URLSearchParams(location.search).get("mode") === "claude";
if (CLAUDE) document.body.classList.add("claude");
const screen = document.getElementById("screen");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function line(html = "", id = "") {
  const d = document.createElement("div");
  d.className = "line"; d.innerHTML = html; if (id) d.id = id; screen.appendChild(d);
  while (screen.children.length > 60) screen.firstChild.remove();
  return d;
}

function prompt() {
  const head = CLAUDE ? `<span class="cc">&gt; </span>`
    : `<span class="prompt"><span class="who">sam@laptop</span> <span class="cwd">~/jobradar</span> $ </span>`;
  const d = line(head);
  const inp = document.createElement("input");
  inp.setAttribute("aria-label", "command");
  d.appendChild(inp); inp.focus();
  inp.addEventListener("keydown", async e => {
    if (e.key !== "Enter") return;
    const cmd = inp.value; inp.replaceWith(document.createTextNode(cmd));
    await play(SESSIONS[cmd.trim()] || [[0, `<span class="bad">unknown demo command</span>`]]);
    prompt();
  });
}

async function typeInto(el, text) {
  for (const ch of text) { el.textContent += ch; await sleep(70 + Math.random() * 40); }
}

async function play(steps) {
  for (const s of steps) {
    if (Array.isArray(s)) { await sleep(s[0]); line(s[1], s[2] || ""); continue; }
    await sleep(s.wait ?? 420);           // {q: question, a: typed answer}
    const d = line(esc(s.q));
    const ans = document.createElement("span"); ans.className = "b"; d.appendChild(ans);
    await sleep(450); await typeInto(ans, s.a); await sleep(350);
  }
}

const D = t => `<span class="dim">${t}</span>`;
const OK = t => `<span class="ok">${t}</span>`;
const W = t => `<span class="warn">${t}</span>`;
const S = t => `<span class="score">${t}</span>`;
const P = t => `<span class="path">${t}</span>`;

  "/jobradar:track Brightline replied: interview Thu 3 Dec 14:00 with Dana (Eng Manager)": [
