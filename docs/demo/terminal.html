<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal</title>
<!-- Replays JobRadar CLI sessions for the README GIF (docs/demo/scene_setup.py). Output text is
     what the CLI prints; run figures come from the synthetic demo home (docs/demo/seed.py). -->
<style>
  :root { --bg: #1f2023; --fg: #e8e3d8; --dim: #8e9099; --ok: #9cc28a; --warn: #d9b26a;
          --score: #e2a663; --path: #8fb3d9; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { font: 19px/1.5 Consolas, "Cascadia Mono", monospace; color: var(--fg);
         padding: 22px 26px; box-sizing: border-box; overflow: hidden; }
  .line { white-space: pre-wrap; min-height: 1.55em; }
  .dim { color: var(--dim); } .ok { color: var(--ok); } .warn { color: var(--warn); }
  .score { color: var(--score); font-weight: bold; } .path { color: var(--path); }
  .prompt .who { color: var(--ok); } .prompt .cwd { color: var(--path); }
  input { all: unset; color: var(--fg); caret-color: var(--fg); width: 70%; }
  #screen { position: absolute; left: 26px; right: 26px; bottom: 22px; }
</style>
</head>
<body>
<div id="screen"></div>
<script>
const screen = document.getElementById("screen");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function line(html = "") {
  const d = document.createElement("div");
  d.className = "line"; d.innerHTML = html; screen.appendChild(d);
  while (screen.children.length > 40) screen.firstChild.remove();
  return d;
}

function prompt() {
  const d = line(`<span class="prompt"><span class="who">sam@laptop</span> <span class="cwd">~/jobradar</span> $ </span>`);
  const inp = document.createElement("input");
  inp.setAttribute("aria-label", "command");
  d.appendChild(inp); inp.focus();
  inp.addEventListener("keydown", async e => {
    if (e.key !== "Enter") return;
    const cmd = inp.value; inp.replaceWith(document.createTextNode(cmd));
    await play(SESSIONS[cmd.trim()] || [[0, `<span class="warn">unknown demo command</span>`]]);
    prompt();
  });
}

async function typeInto(el, text) {
  for (const ch of text) { el.textContent += ch; await sleep(55 + Math.random() * 40); }
}

async function play(steps) {
  for (const s of steps) {
    if (Array.isArray(s)) { await sleep(s[0]); line(s[1]); continue; }
    // {q: question, a: typed answer}
    await sleep(s.wait ?? 260);
    const d = line(esc(s.q));
    const ans = document.createElement("span"); d.appendChild(ans);
    await sleep(380); await typeInto(ans, s.a); await sleep(200);
  }
}

const D = t => `<span class="dim">${t}</span>`;
const SESSIONS = {
  "uv run jobradar init --cv ~/Documents/sam-rivera-cv.pdf": [
    [300, "1/3  LLM key (free tiers are enough)"],
    {q: "     provider [gemini]: ", a: ""},
    [120, D("     get a free key: https://aistudio.google.com/apikey")],
    {q: "     API key: ", a: ""},
    [200, "2/3  CV"],
    [900, D("     read your CV; press Enter to keep a suggestion")],
    [200, "3/3  About you and the jobs you want"],
    {q: "     full name: ", a: "Sam Rivera"},
    {q: "     city, country you live in [Cairo, Egypt]: ", a: ""},
    {q: "     job titles to search [AI Engineer, ML Engineer, Applied AI Engineer]: ", a: ""},
    {q: "     seniority [senior]: ", a: ""},
    {q: "     remote regions you can work from [worldwide]: ", a: "worldwide, emea, mena"},
    {q: "     need visa sponsorship outside your country? [Y/n]: ", a: "y"},
    {q: "     email for applications: ", a: "sam.rivera@example.com"},
    [300, ""],
    [100, `<span class="ok">wrote profile.yaml.</span> Nothing is sent before 2026-11-27 (dry run), then max 5/day.`],
    [100, `Next: <span class="path">jobradar doctor</span>, then <span class="path">jobradar run</span>.`],
  ],
  "uv run jobradar run": [
    [1600, "fetched 11482, new 2434, failed sources 0"],
    [500, "prefilter: {'candidate': 190, 'filtered': 2095, 'duplicate': 149}"],
    [700, `  <span class="score">9.2</span>  Brightline AI - Senior AI Engineer, Agents`],
    [380, `  <span class="score">8.8</span>  Lumen Health - Applied AI Engineer (LLM)`],
    [380, `  <span class="score">5.1</span>  Cobalt Maps - Staff Data Scientist`],
    [380, `  <span class="score">8.6</span>  Northwind Analytics - Forward Deployed Engineer`],
    [380, `  <span class="score">3.4</span>  Harbor Insurance - Backend Engineer`],
    [380, `  <span class="score">8.4</span>  Juniper Voice - AI Engineer - Voice Agents`],
    [400, "scored 54"],
    [800, "drafted {'email': 2, 'whatsapp': 0, 'manual': 6}"],
  ],
  "uv run jobradar top --min 8.5": [
    [250, ` <span id="best"><span class="score">9.2</span>  Brightline AI - Senior AI Engineer, Agents</span>`],
    [40, `      Remote (EMEA) | <span class="ok">eligible</span> | contact: -`],
    [40, `      + Production RAG and agents match the core of the role; evals asked for`],
    [40, `      - Arabic preferred, not stated in CV`],
    [120, ` <span class="score">8.8</span>  Lumen Health - Applied AI Engineer (LLM)`],
    [40, `      Dubai, UAE | <span class="ok">eligible</span> | contact: careers@lumen.example.com`],
    [40, `      + FastAPI + LangGraph stack named in the posting`],
    [40, `      - On-call rotation`],
    [120, ` <span class="score">8.6</span>  Northwind Analytics - Forward Deployed Engineer`],
    [40, `      Cairo, Egypt | <span class="ok">eligible</span> | contact: -`],
    [40, `      + Customer-facing agent builds match the brief; based in Cairo`],
    [40, `      - Asks for 6+ years; CV shows 5`],
    [120, `3 jobs. DB: {'candidate': 136, 'duplicate': 149, 'filtered': 2095, 'scored': 54}`],
  ],
};
prompt();
</script>
</body>
</html>
